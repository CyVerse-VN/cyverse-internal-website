[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyverse-backend"
version = "0.1.0"
description = "CyVerse Internal Tools API"
requires-python = ">=3.13.15,<3.14"
dependencies = [
  "alembic>=1.19,<1.20",
  "fastapi>=0.141,<0.142",
  "psycopg[binary]>=3,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
