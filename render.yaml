# Render Blueprint specification for CyVerse Internal Tools
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cyverse-backend
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Các cấu hình cố định (Render tự động nạp ngầm, không cần nhập)
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CyVerse Internal Tools API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_JWT_ISSUER
        value: cyverse-backend
      - key: AUTH_JWT_AUDIENCE
        value: cyverse-internal-web
      - key: AUTH_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "30"
      - key: SUPABASE_POOLER_REGION
        value: ap-northeast-1
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"

      # Biến bắt buộc DUY NHẤT để deploy backend thành công
      - key: DATABASE_URL
        sync: false
