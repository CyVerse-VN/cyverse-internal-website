# Render Blueprint specification for CyVerse Internal Tools
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cyverse-backend
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # 1. Cấu hình hệ thống cố định (Render tự động nạp ngầm)
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CyVerse Internal Tools API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_JWT_ISSUER
        value: cyverse-backend
      - key: AUTH_JWT_AUDIENCE
        value: cyverse-internal-web
      - key: AUTH_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "30"
      - key: SUPABASE_POOLER_REGION
        value: ap-northeast-1
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"

      # 2. Các biến tùy chọn có giá trị mặc định (không bắt buộc nhập)
      - key: CORS_ORIGINS
        value: ""
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""

      # 3. Database URL (Bắt buộc)
      - key: DATABASE_URL
        sync: false

      # 4. Toàn bộ các API Key AI & Nghiên cứu (Dán từ file .env của bạn)
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEARCH_SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: RESEARCH_OPENALEX_API_KEY
        sync: false
