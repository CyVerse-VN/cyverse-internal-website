# Render Blueprint specification for CyVerse Internal Tools
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cyverse-backend
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Fixed application settings.
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CyVerse Internal Tools API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_JWT_ISSUER
        value: cyverse-backend
      - key: AUTH_JWT_AUDIENCE
        value: cyverse-internal-web
      - key: AUTH_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"

      # Optional settings with defaults.
      - key: CORS_ORIGINS
        value: ""

      # Required server-side TiDB Cloud PostgreSQL connection URL.
      - key: DATABASE_URL
        sync: false

      # Server-side AI and research API keys.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEARCH_SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: RESEARCH_OPENALEX_API_KEY
        sync: false

      # Backend-only Threads TXT storage credentials.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
